<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>
  
  <!-- Base Background -->
  <rect width="32" height="32" rx="7.5" fill="url(#bgGrad)" />
  <rect width="32" height="32" rx="7.5" fill="none" stroke="#10b981" stroke-width="1.2" stroke-opacity="0.35" />
  
  <!-- Financial Pulse Waveform -->
  <path
    d="M 5 19 L 10 19 L 13 13 L 17 21 L 21 9 L 27 9"
    fill="none"
    stroke="url(#lineGrad)"
    stroke-width="2.2"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  
  <!-- Trend Indicator Arrow -->
  <polyline
    points="23 9 27 9 27 13"
    fill="none"
    stroke="#34d399"
    stroke-width="2.2"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  
  <!-- Peak Dot -->
  <circle cx="21" cy="9" r="1.5" fill="#a7f3d0" />
</svg>
